<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>NAVAA</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
  
<style>
  
  /* =====================================
         NAVAA EXCHANGE — DESIGN SYSTEM
  ===================================== */

  :root {
    color-scheme: dark;
   
    --bg: #0b0e11;
    --surface: #181a20;
    --surface2: #202630;
    --surface3: #2b3139;
    --line: #2b3139;
    --text: #eaecef;
    --muted: #848e9c;
    --accent: #f0b90b;
    --accent-hover: #f8d12f;
    --accent-text: #181a20;
    --green: #0ecb81;
    --red: #f6465d;
    --header-bg: #0b0e11;
    --radius: 8px;
    --transition: 0.25s ease;
  }
  
  /*=================================
             LIGHT THEME 
  ===================================*/

  [data-theme="light"] {
    color-scheme: light;

    --bg: #ffffff;
    --surface: #ffffff;
    --surface2: #f5f5f5;
    --surface3: #eeeeee;
    --line: #eaecef;
    --text: #1e2329;
    --muted: #707a8a;
    --accent: #f0b90b;
    --accent-hover: #dba600;
    --accent-text: #181a20;
    --green: #0ecb81;
    --red: #f6465d;
    --header-bg: #ffffff;
  }

  /*=============================
              RESET
  ==============================*/

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 
      Inter,-apple-system, 
      BlinkMacSystemFont, 
      "Segoe UI", Roboto, 
      Arial, sans-serif;
    
    font-size: 14px;
    line-height: 1.5;
    transition:
      background var(--transition),
      color var(--transition);
  }
  
  button,
  input,
  select {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  /*=============================
               MAIN 
  ===============================*/

  main {
    width: 100%;
    max-width: 100%;
    margin: 0 auto; 
    padding: 0 0 56px;
  }

  /*============================
              HEADER 
  ==============================*/

  .top {
    width: 100%;
    min-height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 0 28px;
    background: var(--header-bg);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 100;
    transition: background var(--transition);
  }

 /*=================================
               BRAND
  =================================*/

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

/*  .logo {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: #181a20;
    border-radius: 9px;
    font-size: 23px;
    font-weight: 900;
    transition: transform var(--transition);
  } */

  
/* NAVAA OFFICIAL BRAND LOGO */

.brand-logo {
  width: 64px;
  height: 64px;
  display: block;
  object-fit: contain;
  flex-shrink: 0;
  transition: transform 0.25s ease;
}

.brand-logo:hover {
  transform: scale(1.06);
}


/* MOBILE LOGO 

@media (max-width: 700px) {
  .brand-logo {
    width: 52px;
    height: 52px;
  }
} */



  

/*  .logo:hover {
    transform: rotate(-8deg) scale(1.08);
  } */

  /*======================================
                  NAVIGATION
  ========================================*/

  .main-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .nav-tab {
    position: relative;
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 23px 18px;
    font-size: 14px;
    font-weight: 600;
    transition:
      color var(--transition),
      background var(--transition);
  }
  
  .nav-tab:hover {
    color: var(--text);
  }
  
  .nav-tab.active {
    color: var(--accent);
  }
  
  .nav-tab.active::after {
    content: "";
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: 0;
    height: 3px;
    border-radius: 3px 3px 0 0;
    background: var(--accent);
    animation: navSlide 0.25s ease;
  }

  @keyframes navSlide {
    from {
      transform: scaleX(0.4);
      opacity: 0;
    }
    to {
      transform: scaleX(1);
      opacity: 1;
    }
  }

 /*================================
           HEADER ACTIONS
  ================================*/

  .top-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .row {
    display: flex;
    align-items: center;
  }

  /*=================================
              BUTTONS
  ==================================*/

  .btn {
    min-height: 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 18px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-text);
    font-size: 14px;
    font-weight: 700;
    transition:
      background var(--transition),
      transform var(--transition),
      box-shadow var(--transition);
  }

  .btn:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(240, 185, 11, 0.16);
  }
  
  .btn:active {
    transform: scale(0.97);
  }

  /*=================================
            THEME BUTTONS
  ===================================*/

  .theme-btn {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-size: 18px;
    transition: all var(--transition);
  }
  
  .theme-btn:hover {
    background: var(--surface2);
    border-color: var(--accent);
    transform: rotate(12deg);
  }

  /*========== ACCESSIBILITY =============*/

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  /*========================================
             MOBILE RESPONSIVE
  ==========================================*/

  @media (max-width: 700px) {

    .top {
      min-height: 60px;
      padding: 0 12px;
      gap: 8px;
    }

/*    .logo {
      width: 32px;
      height: 32px;
      font-size: 20px;
    }*/

      .brand-logo {
        width: 52px;
        height: 52px;
      }

    .main-nav {
      gap: 0;
    }

    .nav-tab {
      padding: 20px 10px;
      font-size: 13px;
    }

    .nav-tab.active::after {
      left: 10px;
      right: 10px;
    }

    .top-actions {
      gap: 7px;
    }

    .btn {
      min-height: 35px;
      padding: 0 10px;
      font-size: 12px;
    }

    .theme-btn {
      width: 35px;
      height: 35px;
    }
  }

  @media (max-width: 380px) {

    .top {
      padding: 0 8px;
      gap: 5px;
    }

    .nav-tab {
      padding-left: 7px;
      padding-right: 7px;
      font-size: 12px;
    }

    .btn {
      padding: 0 8px;
      font-size: 11px;
    }
  }

</style>
</head>
  <body>
    <main>

      <!--//////////////////////////////////////////////////////
                HEADER Navbar html Design : Part - 1
      ///////////////////////////////////////////////////////-->
    <header class="top">     
      <div class="brand">
        <img 
          src="navaa-logo.png"
          class="brand-logo"
          alt="NAVAA Token Logo">
      </div>
      
      
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-tab active" id="pageEarnTab" type="button">Earn</button>
        <button class="nav-tab" id="pageExchangeTab" type="button">Exchange</button>
      </nav>
      
      <div class="top-actions row">
        <button 
          class="theme-btn" 
          id="themeToggle" 
          type="button"
          aria-label="Switch theme"
          title="Switch theme">
          ☀
        </button>
        <button class="btn" id="connectBtn">
          Connect wallet
        </button>
      </div>  
    </header>
    <!--==================== END Header Navbar Part - 1 ================--->
      
      
    </main>
    <script>
      /*=========================================================
                          JAVASCRIPT START
      ==========================================================*/
      
      /*========================================
                  NAVAA THEME SYSTEM
      ========================================*/

      const themeToggle = document.getElementById("themeToggle");
      function setTheme(theme) {
        document.documentElement.setAttribute(
          "data-theme",
          theme
        );

        localStorage.setItem("navaa-theme", theme);

        if (themeToggle) {
          themeToggle.textContent =
            theme === "dark" ? "☀" : "☾";
        }
      }
      
      /**************************************
                  Load saved theme
      **************************************/

      const savedTheme =
        localStorage.getItem("navaa-theme") || "dark";
      setTheme(savedTheme);

    /**************************************
                  Toggle theme
    **************************************/

      themeToggle.addEventListener("click", () => {

        const currentTheme =
          document.documentElement.getAttribute("data-theme");
        setTheme(
          currentTheme === "dark" ? "light" : "dark"
        );
      });





      
    </script>
  </body>
</html>
